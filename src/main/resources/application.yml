spring:
  application:
    name: movie-booking

  datasource:
    url: jdbc:h2:mem:moviebooking;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  task:
    scheduling:
      pool:
        size: 2
    execution:
      pool:
        core-size: 4
        max-size: 8

# custom app config - read this from a properties class, don't hardcode in services
app:
  seat-hold:
    expiry-minutes: 5
  pricing:
    weekend-multiplier: 1.5
    premium-multiplier: 1.8
